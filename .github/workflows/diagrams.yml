name: Diagramas

on:
  push:
    branches: [main]
    paths:
      - "docs/diagrams/src/**"
      - "scripts/render-diagrams.sh"
      - ".github/workflows/diagrams.yml"
  pull_request:
    paths:
      - "docs/diagrams/src/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Graphviz e fontes
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-dejavu

      - uses: actions/cache@v4
        with:
          path: .tools
          key: plantuml-${{ hashFiles('scripts/render-diagrams.sh') }}

      - name: Renderizar diagramas
        run: bash scripts/render-diagrams.sh

      # Em pull requests apenas valida; em pushes para main, versiona os SVGs gerados.
      - name: Versionar SVGs
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/diagrams/svg
          if git diff --cached --quiet; then
            echo "Nenhum diagrama mudou."
          else
            git commit -m "docs: renderiza diagramas"
            git push
          fi
