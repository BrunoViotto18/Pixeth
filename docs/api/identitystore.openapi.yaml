openapi: 3.1.0
info:
  title: Pixeth — contrato do IdentityStore
  version: 0.5.0
  summary: Interface que todo IdentityStore implementa para guardar os dados pessoais dos lojistas.
  description: |
    O IdentityStore é a parte descentralizada do Pixeth: qualquer operador pode hospedar um,
    desde que implemente este contrato, e um mesmo IdentityStore pode atender vários
    processadores. Ele guarda os dados pessoais do lojista — nome, CPF/CNPJ, chaves Pix e
    carteiras Ethereum — e gera os próprios ids; o processador apenas os registra.

    - **Autenticação:** somente mTLS, com certificado de um processador inscrito.
    - **Minimização:** o documento nunca é devolvido; o processador só pergunta se um
      documento confere. Listagens devolvem só versões mascaradas.
    - **Idempotência:** criações exigem `Idempotency-Key`; repetir com a mesma chave (em até
      24 horas) devolve o recurso já criado em vez de criar outro. As chaves valem por
      processador (identificado pelo certificado), então processadores diferentes não colidem.
    - **Cifragem:** campos pessoais ficam cifrados em nível de aplicação.
servers:
  - url: https://{host}
    variables:
      host:
        default: identity.example

security:
  - processorMtls: []

tags:
  - name: Titulares
  - name: Chaves Pix
  - name: Carteiras Ethereum
  - name: Operação

paths:
  /v1/owners:
    post:
      tags: [Titulares]
      operationId: createOwner
      summary: Registrar um titular
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalName, document]
              properties:
                legalName: { type: string }
                document:
                  type: string
                  description: 'CPF ou CNPJ, somente dígitos'
                  pattern: '^(\d{11}|\d{14})$'
      responses:
        '201':
          description: Titular criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Created' }
        '200':
          description: Já criado com esta Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Created' }

  /v1/owners/{ownerId}:
    parameters:
      - $ref: '#/components/parameters/OwnerId'
    delete:
      tags: [Titulares]
      operationId: eraseOwner
      summary: Eliminar o titular, suas chaves Pix e suas carteiras (LGPD)
      responses:
        '204': { description: Dados apagados }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/owners/{ownerId}/document-match:
    parameters:
      - $ref: '#/components/parameters/OwnerId'
    post:
      tags: [Titulares]
      operationId: matchDocument
      summary: Conferir se o titular de uma chave Pix é o lojista
      description: |
        Recebe o documento (completo ou mascarado, como o PSP devolve na consulta da chave) e,
        opcionalmente, o nome do titular. Compara os dígitos visíveis e o nome; nunca devolve
        o documento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  type: string
                  description: 'Somente dígitos, ou mascarado com *, por exemplo ***456789**'
                holderName: { type: string }
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/rails/pix/owners/{ownerId}/keys:
    parameters:
      - $ref: '#/components/parameters/OwnerId'
    post:
      tags: [Chaves Pix]
      operationId: addPixKey
      summary: Guardar uma chave Pix do titular
      description: Um titular pode ter várias chaves, inclusive do mesmo tipo.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value]
              properties:
                type: { $ref: '#/components/schemas/PixKeyType' }
                value: { type: string }
      responses:
        '201':
          description: Guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaskedPixKey' }
    get:
      tags: [Chaves Pix]
      operationId: listPixKeys
      summary: Listar as chaves do titular (só versões mascaradas)
      responses:
        '200':
          description: Chaves
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MaskedPixKey' }

  /v1/rails/pix/keys/{keyId}:
    parameters:
      - name: keyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Chaves Pix]
      operationId: getPixKey
      summary: Obter uma chave Pix
      description: |
        `view=full` (padrão) devolve o valor, usado no momento de um envio.
        `view=masked` devolve só a versão mascarada; serve para conferir se a chave existe e a
        qual titular pertence.
      parameters:
        - $ref: '#/components/parameters/View'
      responses:
        '200':
          description: Chave
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [id, ownerId, type, value]
                    properties:
                      id: { type: string, format: uuid }
                      ownerId: { type: string, format: uuid }
                      type: { $ref: '#/components/schemas/PixKeyType' }
                      value: { type: string }
                  - $ref: '#/components/schemas/MaskedPixKey'
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Chaves Pix]
      operationId: deletePixKey
      summary: Remover uma chave Pix
      responses:
        '204': { description: Removida }

  /v1/rails/ethereum/owners/{ownerId}/wallets:
    parameters:
      - $ref: '#/components/parameters/OwnerId'
    post:
      tags: [Carteiras Ethereum]
      operationId: addEthereumWallet
      summary: Guardar uma carteira do titular, com a prova de posse
      description: |
        A mensagem SIWE (EIP-4361) e a assinatura da carteira ficam guardadas como evidência de
        que o lojista controlava o endereço no momento da inscrição. Um titular pode ter várias
        carteiras.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chainId, address, siweMessage, siweSignature]
              properties:
                chainId: { type: integer, example: 11155111 }
                address: { $ref: '#/components/schemas/EthereumAddress' }
                siweMessage: { type: string }
                siweSignature: { type: string, pattern: '^0x[0-9a-fA-F]+$' }
      responses:
        '201':
          description: Guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaskedWallet' }
    get:
      tags: [Carteiras Ethereum]
      operationId: listEthereumWallets
      summary: Listar as carteiras do titular (só versões mascaradas)
      responses:
        '200':
          description: Carteiras
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MaskedWallet' }

  /v1/rails/ethereum/wallets/{walletId}:
    parameters:
      - name: walletId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Carteiras Ethereum]
      operationId: getEthereumWallet
      summary: Obter uma carteira
      description: |
        `view=full` (padrão) devolve rede e endereço, usados no momento de uma entrega.
        `view=masked` devolve só a versão mascarada; serve para conferir se a carteira existe e a
        qual titular pertence.
      parameters:
        - $ref: '#/components/parameters/View'
      responses:
        '200':
          description: Carteira
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [id, ownerId, chainId, address]
                    properties:
                      id: { type: string, format: uuid }
                      ownerId: { type: string, format: uuid }
                      chainId: { type: integer }
                      address: { $ref: '#/components/schemas/EthereumAddress' }
                  - $ref: '#/components/schemas/MaskedWallet'
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Carteiras Ethereum]
      operationId: deleteEthereumWallet
      summary: Remover uma carteira
      responses:
        '204': { description: Removida }

  /v1/health:
    get:
      tags: [Operação]
      operationId: getHealth
      summary: Saúde do serviço e validade do certificado
      responses:
        '200':
          description: Disponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [UP, DEGRADED] }
                  certificateNotAfter: { type: string, format: date-time }

components:
  securitySchemes:
    processorMtls:
      type: mutualTLS
      description: 'Certificado do processador (urn:pixeth:processor:{deploymentId}) emitido pela AC da implantação.'

  parameters:
    OwnerId:
      name: ownerId
      in: path
      required: true
      description: Id do titular, gerado pelo IdentityStore.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    View:
      name: view
      in: query
      schema: { type: string, enum: [full, masked], default: full }

  responses:
    NotFound:
      description: Inexistente
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title: { type: string }
              status: { type: integer }

  schemas:
    Created:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }

    MaskedPixKey:
      type: object
      required: [id, ownerId, type, masked]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/PixKeyType' }
        masked: { type: string, example: '***.456.789-**' }

    MaskedWallet:
      type: object
      required: [id, ownerId, chainId, masked]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        chainId: { type: integer }
        masked: { type: string, example: '0xABC1…9F3c' }

    PixKeyType:
      type: string
      enum: [CPF, CNPJ, EMAIL, PHONE, EVP]

    EthereumAddress:
      type: string
      pattern: '^0x[0-9a-fA-F]{40}$'
